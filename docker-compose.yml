# FacturaScripts - Desarrollo local
# Monta el código fuente para cambios en vivo (hot reload)

services:
  app:
    build:
      context: .
      network: host
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html                    # Código montado (cambios en vivo)
      - vendor:/var/www/html/vendor        # vendor desde imagen (no se sobreescribe)
      - myfiles:/var/www/html/MyFiles      # Datos persistentes
    depends_on:
      db:
        condition: service_healthy
    environment:
      APACHE_DOCUMENT_ROOT: /var/www/html

  db:
    image: postgres:alpine
    environment:
      POSTGRES_DB: facturascripts
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  vendor:
  myfiles:
