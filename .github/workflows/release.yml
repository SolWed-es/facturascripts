name: Build Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: solwed/production   # siempre desde esta rama

      - name: Install dependencies
        run: |
          composer install --no-dev --optimize-autoloader
          npm install --omit=dev

      - name: Validate version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          KERNEL_VERSION=$(php -r "require 'vendor/autoload.php'; echo \FacturaScripts\Core\Kernel::version();")
          if [ "$TAG_VERSION" != "$KERNEL_VERSION" ]; then
            echo "::error::Tag version $TAG_VERSION does not match Kernel::version() $KERNEL_VERSION"
            exit 1
          fi

      - name: Build ZIP
        run: |
          mkdir -p /tmp/build/facturascripts
          rsync -av \
            --exclude='.git' --exclude='.github' \
            --exclude='.docker' --exclude='Dockerfile' \
            --exclude='docker-compose.yml' \
            --exclude='MyFiles' --exclude='Plugins' \
            --exclude='tests' --exclude='phpunit.xml*' \
            --exclude='phpstan.neon*' --exclude='phpcs.xml*' \
            --exclude='CLAUDE.md' --exclude='.env*' \
            --exclude='CHANGELOG.md' \
            . /tmp/build/facturascripts/
          cd /tmp/build && zip -r facturasolwed.zip facturascripts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "FacturaSolwed ${{ github.ref_name }}"
          target_commitish: solwed/production
          files: /tmp/build/facturasolwed.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
